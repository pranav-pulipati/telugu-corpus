  secondary_categories: [LEX]
  genres: [encyclopedic, biography, geography, cinema, history, science]
  historical_period: Contemporary (2003-present)
  telugu_scope: Telugu-only
  formats: [XML (bz2), SQL, JSON (CirrusSearch dumps)]
  content_types: [encyclopedia articles]
